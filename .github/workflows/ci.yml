name: ci

# Unified CI/CD pipeline: format -> test -> deploy
#
# Stages:
#   format               ruff lint + ruff format check + mypy on testo_core and testo_api (all blocking)
#   test                 fast required pytest suite with the coverage gate (folds in
#                        the old pr-fast workflow); uploads coverage.xml
#   frontend             React dashboard: typecheck, generated API types up to date,
#                        vitest unit tests, production build
#   changelog_required    PR-only: fails if non-doc changes don't touch CHANGELOG.md
#                          (escape hatch: 'no-changelog' PR label)
#   docs_vault           lints the docs/ vault against docs/CLAUDE.md (frontmatter,
#                        links, orphans; on PRs also the `updated` date)
#   package              builds the sdist and wheel, `twine check --strict`, then installs
#                        the wheel with no extras and runs a cycle (scripts/package_smoke.sh)
#   deploy               builds the distributable wheel on a published release
#
# Code review is handled by a local pre-push hook (.claude/settings.json),
# not by CI -- see 990be121 for why the earlier CI-based review was dropped.

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  push:
    branches: [main]
  release:
    types: [published]

# Cancel superseded runs on the same ref so we never pay for stale test runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  format:
    name: format (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # mypy needs the real dependencies (SQLModel, Rich, FastAPI, ...) to
      # check against their types instead of treating them as Any.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check --output-format=github .
      - name: Ruff format check
        run: ruff format --check --diff .
      - name: mypy
        run: mypy testo_core testo_api

  test:
    name: test (fast required, ${{ matrix.python-version }})
    needs: format
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      # Coverage sources (testo_core + testo_api, line + branch) and the 65%
      # gate come from pytest.ini; measuring costs ~15 s on this suite.
      - name: Run fast required suite (with coverage gate)
        run: python -m pytest -q -m "tier_fast and not quarantined" --maxfail=1 --cov-report=xml
      - name: Upload coverage report
        if: always() && matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore
      # frontend/openapi.json is the contract the React app's types are
      # generated from; fail if a Pydantic model changed without re-exporting.
      - name: OpenAPI schema up to date
        if: matrix.python-version == '3.11'
        run: python scripts/export_openapi.py --check
      - name: Upload diagnostics artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-test-artifacts-${{ matrix.python-version }}
          path: |
            .artifacts/e2e/**
            **/*.log
            **/*summary*.json
            **/*api*.json
            **/*.png

  frontend:
    name: frontend (typecheck + vitest + build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Generated API types up to date
        run: |
          npm run gen:api
          git diff --exit-code -- src/lib/api-schema.ts || {
            echo "::error::src/lib/api-schema.ts is stale. Run 'npm --prefix frontend run gen:api' and commit the result."
            exit 1
          }
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build

  changelog_required:
    name: changelog required
    if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'no-changelog')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require CHANGELOG.md update
        run: |
          git fetch origin "${{ github.event.pull_request.base.ref }}"
          git diff --name-only origin/"${{ github.event.pull_request.base.ref }}"...HEAD | grep -q "^CHANGELOG.md$" || {
            echo "::error::Non-documentation changes require CHANGELOG.md to be updated. See CONTRIBUTING.md for guidelines."
            exit 1
          }

  docs_vault:
    name: docs_vault (linting)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint docs vault
        run: python scripts/docs_vault.py lint

  package:
    name: package
    needs: [format, test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
      - name: Build sdist and wheel
        run: python -m build
      - name: Check package metadata
        run: twine check --strict dist/*
      - name: Install wheel and run smoke test
        run: |
          python -m pip install dist/*.whl
          bash scripts/package_smoke.sh

  deploy:
    name: deploy
    if: github.event_name == 'release'
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
      - name: Build distributable wheel
        run: python -m build --wheel
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}